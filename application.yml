app:
  name: Settlement
  business_function: BACK_OFFICE
  pillar: "Trade Processing"
  flow-enrichment:
    data-field: data
    frequency-field: frequency
  integrations:
    documentation:
      base-url: https://documentation.internal/api/v1/cashflows
      target-application: Documentation
      connection-kind: API
      channel: /api/v1/cashflows
      data: cashflow
      frequency: real-time
    accounting:
      base-url: https://accounting.internal/api/v1/cash-movements
      target-application: Accounting
      connection-kind: API
      channel: /api/v1/cash-movements
      data: cashflow
      frequency: daily

spring:
  rabbitmq:
    listener:
      queues: settlement.cashflows
      produced-by-application: Booking
      connection-kind: MQ
      message:
        data: cashflow
        frequency: daily
